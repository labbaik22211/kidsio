<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Options</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Choose Payment Option</h1>
    </header>
    
    <div style="max-width: 400px; margin: 0 auto; padding: 20px; background: white; border-radius: 10px; border: 1px solid #ddd;">
        <div class="payment-option" style="color: #dc2626; font-weight: bold; margin-bottom: 5px;">bKash Send Money: 01851242532</div>
        <div class="payment-option" style="color: #f97316; font-weight: bold; margin-bottom: 5px;">Nagad Send Money: 01787775261</div>
        <div class="payment-option" style="color: #16a34a; font-weight: bold; margin-bottom: 15px;">Cash on Delivery Available</div>
        
        <form id="payment-form" style="display: flex; flex-direction: column; gap: 10px;">
            <label for="customer-name">Customer Name</label>
            <input type="text" id="customer-name" required style="padding: 8px; border: 1px solid #ccc; border-radius: 5px;">

            <label for="transaction-id">Transaction ID (TrxID)</label>
            <input type="text" id="transaction-id" placeholder="Optional for COD" style="padding: 8px; border: 1px solid #ccc; border-radius: 5px;">

            <label for="address">Address</label>
            <input type="text" id="address" required style="padding: 8px; border: 1px solid #ccc; border-radius: 5px;">

            <label for="amount">Amount</label>
            <input type="text" id="amount" required style="padding: 8px; border: 1px solid #ccc; border-radius: 5px;">

            <button type="submit" style="background-color: #ec4899; color: white; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px;">Confirm Order</button>
        </form>
    </div>
</body>
</html>
