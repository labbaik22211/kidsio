<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Fashion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>👶 Kids Fashion Collection</h1>
        <p>সেরা মানের বাচ্চাদের পোশাকের বিশ্বস্ত শপ</p>
    </header>
    <main>
        <section id="products">
            <div class="product" onclick="openPaymentOptions()">
                <img src="https://via.placeholder.com/200x200?text=Baby+Pants" alt="Baby Pants">
                <h2>Baby Pants</h2>
                <p class="price"><strike>৳৭০০</strike> ৳৩৫০</p>
                <p class="discount">50% Discount</p>
            </div>
            <div class="product" onclick="openPaymentOptions()">
                <img src="https://via.placeholder.com/200x200?text=Baby+Shirt" alt="Baby Shirt">
                <h2>Baby Shirt</h2>
                <p class="price"><strike>৳৬০০</strike> ৳৩০০</p>
                <p class="discount">50% Discount</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
